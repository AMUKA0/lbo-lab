[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lbo-engine"
version = "0.1.0"
description = "A deal-level LBO engine: sources & uses, multi-tranche debt schedule with cash sweep, iterative interest solve, exit returns and attribution."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "numpy>=1.26",
    "pandas>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx2", "formulas>=1.2"]
# The API offers workbook export and upload, so it needs both — openpyxl to
# build the file and python-multipart for FastAPI to accept one. Neither is
# optional in practice: without multipart the app fails at IMPORT time, because
# the route decorator inspects the signature.
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
]
# The engine can build a workbook without FastAPI installed at all.
excel = ["openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
